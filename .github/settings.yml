# 该文件适用于 GitHub Settings / Probot 等配置机器人。
# 接入真实远程仓库后，需安装对应机器人或按 docs/branch-protection.md 手工配置。

repository:
  has_issues: true
  has_wiki: false
  has_projects: false
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - backend
          - frontend
          - integration
          - security
          - e2e
      enforce_admins: false
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      restrictions: null
