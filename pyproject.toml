[project]
name = "csagent"
version = "0.1.0"
description = "电商店铺智能客服Agent平台"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/knowledge/embedding.py",
    "app/core/redis_client.py",
]

[tool.coverage.report]
fail_under = 50

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
    "BLE001",
    "UP035",
    "DTZ001",
    "DTZ003",
    "RUF012",
    "B023",
    "F841",
    "B904",
    "B905",
    "SIM102",
    "SIM105",
    "SIM115",
    "E741",
]
