version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
      POSTGRES_DB: csagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-csagent}:${POSTGRES_PASSWORD}@postgres:5432/csagent
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/shop/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    ports:
      - "80:80"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c "while true; do
        pg_dump -h postgres -U ${POSTGRES_USER:-csagent} csagent | gzip > /backup/csagent-$$(date +%Y%m%d%H%M).sql.gz;
        find /backup -name '*.sql.gz' -mtime +7 -delete;
        sleep 86400;
      done"
    volumes:
      - ./backup:/backup

volumes:
  pgdata:
  redisdata:
