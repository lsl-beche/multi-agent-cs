# K8s部署清单：Deployment + Service + HPA（弹性扩缩容，应对大促流量高峰）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csagent
  labels:
    app: csagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: csagent
  template:
    metadata:
      labels:
        app: csagent
    spec:
      containers:
        - name: csagent
          image: csagent:0.1.0   # TODO: 替换为镜像仓库地址
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: csagent-secret   # TODO: kubectl create secret（LLM_API_KEY/DB连接串等）
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: csagent
spec:
  selector:
    app: csagent
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: csagent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csagent
  minReplicas: 2
  maxReplicas: 20   # 大促期间弹性扩容
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
