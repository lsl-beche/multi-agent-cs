apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: csagent-backend-hpa
  namespace: csagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csagent-backend
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: csagent-web-hpa
  namespace: csagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csagent-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
