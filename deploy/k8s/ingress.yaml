apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: csagent
  namespace: csagent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: csagent-backend
spec:
  tls:
    - hosts:
        - mall.example.com
      secretName: csagent-tls
  rules:
    - host: mall.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: csagent-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: csagent-web
                port:
                  number: 80
