# 生产 Secret 示例（实际值用 `kubectl create secret generic csagent-secrets --from-env-file=.env.production` 注入）
apiVersion: v1
kind: Secret
metadata:
  name: csagent-secrets
  namespace: csagent
type: Opaque
stringData:
  JWT_SECRET_KEY: "CHANGE_ME"
  API_SECRET_KEY: "CHANGE_ME"
  PAYMENT_GATEWAY_SECRET: "CHANGE_ME"
  POSTGRES_URL: "postgresql+psycopg://csagent:CHANGE_ME@postgres:5432/csagent"
  REDIS_URL: "redis://redis:6379/0"
  LLM_DAILY_QUOTA: "200"
  LLM_REQUEST_MAX_TOKENS: "512"
  FIELD_ENCRYPTION_KEY: "CHANGE_ME"
  LOGISTICS_API_KEY: "CHANGE_ME"
